<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conheça Nossa Escola</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f4f4;
        }

        header{
            background:#004080;
            color:white;
            text-align:center;
            padding:30px;
        }

        header h1{
            font-size:40px;
        }

        .galeria{
            width:90%;
            max-width:1200px;
            margin:40px auto;
        }

        .galeria h2{
            text-align:center;
            color:#333;
            margin-bottom:30px;
        }

        .grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
            gap:20px;
        }

        .card{
            background:white;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
            transition:0.3s;
        }

        .card:hover{
            transform:scale(1.03);
        }

        .card img{
            width:100%;
            height:250px;
            object-fit:cover;
            display:block;
        }

        .card h3{
            text-align:center;
            padding:15px;
            color:#333;
        }

        footer{
            background:#004080;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:40px;
        }
    </style>

</head>
<body>

<header>
    <h1>Conheça Nossa Escola</h1>
</header>

<section class="galeria">

    <h2>Nossa Estrutura</h2>

    <div class="grid">

        <div class="card">
            <img src="laboratorio1.png" alt="Laboratório de Informática">
            <h3>Laboratório de Informática</h3>
        </div>

        <div class="card">
            <img src="laboratorio2.png" alt="Laboratório de Ciências">
            <h3>Laboratório de Ciências</h3>
        </div>

        <div class="card">
            <img src="quadra1.png" alt="Quadra Poliesportiva">
            <h3>Quadra Poliesportiva</h3>
        </div>

        <div class="card">
            <img src="quadra2.jpg" alt="Área Esportiva">
            <h3>Área Esportiva</h3>
        </div>

    </div>

</section>

<footer>
    <p>&copy; 2026 - Nossa Escola</p>
</footer>

</body>
</html>
