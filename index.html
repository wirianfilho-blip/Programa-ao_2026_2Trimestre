<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria da Escola</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }

        h1, h2 {
            text-align: center;
        }

        .galeria-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 300px;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card p {
            padding: 10px;
            font-weight: bold;
            margin: 0;
        }
    </style>
</head>
<body>

    <h1>Nossa Escola</h1>

    <h2>Laboratório de Informática</h2>
    <div class="galeria-container">
        <div class="card">
            <img src="laboratorio1.png" alt="Nosso Laboratório Atualmente">
            <p>Laboratório de Informática (Atual)</p>
        </div>
        <div class="card">
            <img src="laboratorio2.png" alt="Como Gostaríamos que Estivesse Nosso Laboratório">
            <p>Laboratório de Informática (Futuro)</p>
        </div>
    </div>

    <br><hr><br>

    <h2>Quadra Esportiva</h2>
    <div class="galeria-container">
        <div class="card">
            <img src="quadra1.png" alt="Quadra Esportiva 1">
            <p>Quadra de Esportes 1</p>
        </div>
        <div class="card">
            <img src="quadra2.png" alt="Quadra Esportiva 2">
            <p>Quadra de Esportes 2</p>
        </div>
    </div>

</body>
</html>
