<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escola</title>

    <style>
        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#f4f4f4;
        }

        header{
            background:#0056b3;
            color:white;
            text-align:center;
            padding:25px;
        }

        .galeria{
            width:90%;
            max-width:1100px;
            margin:40px auto;
        }

        .galeria h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        .grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
            gap:20px;
        }

        .card{
            background:white;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
            transition:.3s;
        }

        .card:hover{
            transform:scale(1.03);
        }

        .card img{
            width:100%;
            height:250px;
            object-fit:cover;
            display:block;
        }

        .card h3{
            text-align:center;
            padding:15px;
            margin:0;
        }
    </style>

</head>

<body>

<header>
    <h1>Conheça Nossa Escola</h1>
</header>

<section class="galeria">

    <h2>Galeria de Fotos</h2>

    <div class="grid">

        <div class="card">
            <img src="escola01.png" alt="Escola 1">
            <h3>Ambiente Escolar</h3>
        </div>

        <div class="card">
            <img src="escola02.png" alt="Escola 2">
            <h3>Estrutura da Escola</h3>
        </div>

        <div class="card">
            <img src="escola01.png" alt="Escola 1">
            <h3>Laboratório</h3>
        </div>

        <div class="card">
            <img src="escola02.png" alt="Escola 2">
            <h3>Quadra Esportiva</h3>
        </div>

    </div>

</section>

</body>
</html>
