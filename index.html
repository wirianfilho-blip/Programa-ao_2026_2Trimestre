<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game do Saber | Nossa Escola</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* Reseta estilos padrão */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f7f4; /* Tom suave e acolhedor */
            color: #2d3748;
            line-height: 1.7;
        }

        /* Menu de Navegação */
        header {
            background-color: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav ul {
            display: flex;
            justify-content: center;
            list-style: none;
            gap: 15px;
            padding: 15px 20px;
            flex-wrap: wrap;
        }

        nav a {
            color: #4a5568;
            text-decoration: none;
            font-weight: 700;
            padding: 8px 18px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        nav a:hover {
            background-color: #e6f4ea;
            color: #2e7d32;
        }

        /* Conteúdo Principal */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Área de Boas-Vindas & Logo */
        .hero {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 25px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
            margin-bottom: 35px;
        }

        .logo-container {
            margin: 20px 0;
        }

        .logo-img {
            max-width: 220px;
            height: auto;
            transition: transform 0.3s ease;
        }

        .logo-img:hover {
            transform: scale(1.05);
        }

        h1 {
            font-family: 'Fredoka', cursive;
            font-size: 2.8rem;
            color: #2d6a4f;
            margin-bottom: 5px;
        }

        .subtitulo {
            font-weight: 700;
            color: #52b788;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.95rem;
        }
